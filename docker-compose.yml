services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: holma/backend:latest
    container_name: holma-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-false}
      - FORCE_HTTPS=${FORCE_HTTPS:-false}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - DATABASE_URL=sqlite:////data/backupgenie.db
      # Timezone for scheduled backups ("03:00" = local wall clock)
      - TZ=${TZ:-Europe/Berlin}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - BACKUP_BASE_PATH=/mnt/backup
      - MAX_PARALLEL_TASKS=${MAX_PARALLEL_TASKS:-auto}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
      - DOCKER_HELPER_IMAGE=${DOCKER_HELPER_IMAGE:-alpine:3.24.1}
      - SOURCES_CONFIG_PATH=/app/config/sources.json
      - RCLONE_CONFIG_PATH=/app/config/rclone.conf
      - NOTIFICATION_CONFIG_PATH=/app/config/notifications.json
      # Platform auto-detection (auto|raspberrypi|synology|server)
      - PLATFORM_PROFILE=${PLATFORM_PROFILE:-auto}
      # Notifications (non-secret config)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      # All credentials (tokens, passwords, API keys) are managed
      # via the Web UI: Settings → Credentials (encrypted in DB)
    volumes:
      - ${CONFIG_PATH:-./config}:/app/config
      - ${DATA_PATH:-./data}:/data
      - ${BACKUP_BASE_PATH:-/mnt/backup}:/mnt/backup
      - ${LOGS_PATH:-./logs}:/var/log/backupgenie
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker backups (optional)
      - /run/udev:/run/udev:ro  # USB device detection (optional)
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    networks:
      - holma
    deploy:
      resources:
        limits:
          cpus: '${BACKEND_CPU_LIMIT:-2.0}'
          memory: ${BACKEND_MEMORY_LIMIT:-1G}
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: holma/frontend:latest
    container_name: holma-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - holma
    deploy:
      resources:
        limits:
          cpus: '${FRONTEND_CPU_LIMIT:-1.0}'
          memory: ${FRONTEND_MEMORY_LIMIT:-256M}
        reservations:
          cpus: '0.25'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  holma:
    driver: bridge

volumes:
  data:
    driver: local
  logs:
    driver: local
