# Rclone Configuration Example
# Copy this file to rclone.conf and configure your remotes

# Google Drive Example
[gdrive]
type = drive
client_id = YOUR_CLIENT_ID
client_secret = YOUR_CLIENT_SECRET
scope = drive
token = {"access_token":"YOUR_ACCESS_TOKEN","token_type":"Bearer","refresh_token":"YOUR_REFRESH_TOKEN","expiry":"2024-01-01T00:00:00Z"}

# Dropbox Example
[dropbox]
type = dropbox
client_id = YOUR_CLIENT_ID
client_secret = YOUR_CLIENT_SECRET
token = {"access_token":"YOUR_ACCESS_TOKEN","token_type":"bearer","expiry":"0001-01-01T00:00:00Z"}

# Amazon S3 Example
[s3]
type = s3
provider = AWS
env_auth = false
access_key_id = YOUR_ACCESS_KEY
secret_access_key = YOUR_SECRET_KEY
region = us-east-1
acl = private

# To configure interactively, run:
# docker exec -it holma-backend rclone config
