# Holma - Portainer Stack mit pre-built Images (kein Build nötig)
# Nutzt fertige Images von GitHub Container Registry
#
# Verzeichnisstruktur auf der NAS:
# /volume1/docker/holma/
# ├── config/sources.json
# ├── data/
# ├── logs/
# └── backup/

services:
  backend:
    image: ghcr.io/hehljo/holma-backend:latest
    container_name: holma-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-5050}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-false}
      - FORCE_HTTPS=${FORCE_HTTPS:-false}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - DATABASE_URL=sqlite:////data/backupgenie.db
      # Timezone for scheduled backups ("03:00" = local wall clock)
      - TZ=${TZ:-Europe/Berlin}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - BACKUP_BASE_PATH=/mnt/backup
      - MAX_PARALLEL_TASKS=${MAX_PARALLEL_TASKS:-auto}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
      - DOCKER_HELPER_IMAGE=${DOCKER_HELPER_IMAGE:-alpine:3.24.1}
      - SOURCES_CONFIG_PATH=/app/config/sources.json
      - RCLONE_CONFIG_PATH=/app/config/rclone.conf
      - NOTIFICATION_CONFIG_PATH=/app/config/notifications.json
      - PLATFORM_PROFILE=${PLATFORM_PROFILE:-auto}
      # Notifications (non-secret config)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      # All credentials (tokens, passwords, API keys) are managed
      # via the Web UI: Settings → Credentials (encrypted in DB)
    volumes:
      - ${CONFIG_PATH:-/volume1/docker/holma/config}:/app/config
      - ${DATA_PATH:-/volume1/docker/holma/data}:/data
      - ${BACKUP_BASE_PATH:-/volume1/docker/holma/backup}:/mnt/backup
      - ${LOGS_PATH:-/volume1/docker/holma/logs}:/var/log/backupgenie
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - holma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/hehljo/holma-frontend:latest
    container_name: holma-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3080}:3000"
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - holma
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  holma:
    driver: bridge
